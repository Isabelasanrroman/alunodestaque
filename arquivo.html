<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Página do Curso</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
}

.topo {
    width: 100%;
    height: 80px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    background-image: url(imagens/fundo2.png);
    background-size: cover;
    background-position: center;
}

.logo {
    width: 100%;
    padding: 20px;
    margin-left: 18px;
}

.logo img {
    width: 150px;
}

.curso {
    font-size: 18px;
    font-weight: bold;
    color: #d10000;
}

.sair button {
    background: none;
    border: none;
    cursor: pointer;
}

.sair img {
    width: 25px;
    border-color: #ffffff;
}

.conteudo {
    padding: 30px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(0,0,0,0.12);
    font-size: 14px;
}

thead {
    background: linear-gradient(135deg, #c00000, #8b0000);
    color: white;
}

thead th {
    padding: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 13px;
}

tbody td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

tbody tr:hover {
    background: #f8f8f8;
    transition: 0.2s;
}

</style>

<body>

    <header class="topo">
        <div class="logo">
            <img src="https://www.precisaocortelaser.com.br/wp-content/uploads/2020/07/logo-senai-1.png" alt="">
        </div>

        <div class="curso">
            Desenvolvimento de Sistemas III
        </div>

        <div class="sair">
        <button>
            <img src="https://cdn-icons-png.flaticon.com/128/126/126467.png" alt="">
        </button>
</div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    </header>

    <main class="conteudo">
    <table id="tabela" style="width:100%; border-collapse: collapse; background:white; border-radius:10px; overflow:hidden;">
    <thead>
        <tr style="background:#d10000; color:white;">
            <th>Aluno</th>
            <th>Média</th>
            <th>Frequência</th>
            <th>Classificação</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
</main>

<script>
const alunos = JSON.parse(localStorage.getItem("alunos"));

if (!alunos || alunos.length === 0) {
    alert("Nenhum dado encontrado!");
}

const tbody = document.querySelector("#tabela tbody");

alunos.forEach(a => {
    tbody.innerHTML += `
        <tr>
            <td>${a.nome}</td>
            <td>${a.media}</td>
            <td>${a.frequencia}%</td>
            <td>${a.medalha}</td>
        </tr>
    `;
});
</script>


</body>
</html>
