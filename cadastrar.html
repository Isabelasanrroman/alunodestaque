<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cursos</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        height: 100vh;
    }

    .background {
        width: 100%;
        height: 100vh;
        background: url(imagens/fundo.png);
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .logo {
        margin-bottom: 15px;
    }

    .logo img {
        width: 150px;
    }

    .card {
        width: 380px;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 0 120px rgba(0, 0, 0, 0.242);
        text-align: center;
    }

    .card h2 {
        color: #c00000;
        font-size: 18px;
        margin-bottom: 25px;
        letter-spacing: 1px;
    }

    .input {
        background: #e6e6e6;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
    }

    .input span {
        color: #777;
        font-size: 14px;
        margin-right: 10px;
        min-width: 50px;
    }

    .input input {
        border: none;
        background: transparent;
        outline: none;
        font-size: 15px;
        width: 100%;
    }

    .card button {
        width: 120px;
        height: 40px;
        background: #d10000;
        border: none;
        border-radius: 5px;
        color: white;
        font-weight: bold;
        margin-top: 10px;
        cursor: pointer;
    }

    .card button:hover {
        background: #bd0000;
        box-shadow: 0 0 20px #0000004c;
    }

    .login {
        margin-top: 15px;
        font-size: 14px;
    }

    .login a {
        color: #cd1919;
        font-weight: bold;
        text-decoration: none;
    }
</style>

<body>

    <div class="background">
        <div class="container">

            <div class="logo">
                <img src="https://www.precisaocortelaser.com.br/wp-content/uploads/2020/07/logo-senai-1.png">
            </div>

            <div class="card">
                <h2>CADASTRE-SE</h2>

                <div class="input">
                    <span>Nome</span>
                    <input type="text" id="nome">
                </div>

                <div class="input">
                    <span>Email</span>
                    <input type="email" id="email">
                </div>

                <div class="input">
                    <span>Senha</span>
                    <input type="password" id="senha">
                </div>

                <button onclick="cadastrar()">CADASTRAR</button>
            </div>

            <p class="login">
                Já possui uma conta? <a href="#">Entrar</a>
            </p>

        </div>
    </div>

</body>
</html>
