<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas Cadastradas</title>
    <link rel="stylesheet" href="../static/css/cursoscadastrados.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="https://www.precisaocortelaser.com.br/wp-content/uploads/2020/07/logo-senai-1.png" alt="Logo SENAI">
        </div>

        <div class="sair">
            <button onclick="window.location.href='index.html'">
                <img src="https://cdn-icons-png.flaticon.com/128/126/126467.png" alt="">
            </button>
        </div>
    </header>

    <main>
        <div class="lista" id="listaTurmas"></div>

        <div class="conteudo">
            <div class="medalhas">
                <div class="box">
                    <img src="../static/imagens/medalha1.png" alt="">
                    <p><span>Média</span> >= 95</p>
                    <p><span>Frequência</span> = 100%</p>
                    <p>Todos os <span>Cursos EADs</span> disponíveis devem ser completados</p>
                </div>

                <div class="box">
                    <img src="../static/imagens/medalha3.png" alt="">
                    <p><span>Média</span> >= 95</p>
                    <p><span>Frequência</span> >= 97%</p>
                    <p>Todos os <span>Cursos EADs</span> disponíveis devem ser completados</p>
                </div>

                <div class="box">
                    <img src="../static/imagens/medalha2.png" alt="">
                    <p><span>Média</span> >= 95</p>
                    <p><span>Frequência</span> >= 95%</p>
                    <p>Todos os <span>Cursos EADs</span> disponíveis devem ser completados</p>
                </div>
            </div>

            <div class="btn-fixo">
                <button onclick="window.location.href='cadastrarturmas.html'">CADASTRAR TURMA</button>
            </div>
        </div>
    </main>

    <script src="../static/java_script/cursoscadastrados.js"></script>

</body>
</html>
