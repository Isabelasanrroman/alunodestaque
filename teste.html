<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cursos - SENAI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ededed;
        }

        header {
            width: 100%;
            height: 80px;
            background-image: url(imagens/fundo2.png);
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .logo {
            width: 100%;
            padding: 20px;
            margin-left: 18px;
        }

        .logo img {
            width: 150px;
        }

        .sair button {
            background: none;
            border: none;
            cursor: pointer;
        }

        .sair img {
            width: 28px;
        }

        main {
            display: flex;
            padding: 80px 100px;
        }

        .lista {
            width: 340px;
            height: 100%;
            background: #fff;
            border-radius: 10px;
            padding: 50px 45px;
            box-shadow: 0 0 15px rgba(30, 30, 30, 0.091);
        }

        .lista button {
            width: 100%;
            background: none;
            border: none;
            text-align: left;
            font-size: 19px;
            color: #b10000;
            margin: 14px 0;
            cursor: pointer;
            transition: 0.2s;
        }

        .lista button:hover {
            transform: translateY(4px);
        }

        .conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .medalhas {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-left: 60px;
            line-height: 20px;
            text-align: left;
        }

        .box {
            background: transparent;
            padding: 15px;
        }

        .box img {
            width: 80px;
            margin-bottom: 15px;
        }

        .box p {
            font-size: 14px;
            color: #555;
            margin: 8px 0;
        }

        .box span {
            color: #d10000;
            font-weight: bold;
        }

        .btn-fixo {
            align-self: flex-end;
        }

        .btn-fixo button {
            background: #d10000;
            color: #fff;
            border: 2px solid #b10000;
            padding: 14px 35px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.25s;
        }

        .btn-fixo button:hover {
            background: transparent;
            color: #b00000;
            border:2px solid #b00000;
        }

    </style>
</head>

<body>

    <header>
        <div class="logo">
            <img src="https://www.precisaocortelaser.com.br/wp-content/uploads/2020/07/logo-senai-1.png" alt="Logo SENAI">
        </div>

        <div class="sair">
            <button onclick="window.location.href='index.html'">
                <img src="https://cdn-icons-png.flaticon.com/128/126/126467.png" alt="">
            </button>
        </div>
    </header>

    <main>
        <div class="lista">
            <button>Administração Manhã</button>
            <button>Administração Tarde</button>
            <button>Desenvolvimento de Sistemas II</button>
            <button>Desenvolvimento de Sistemas III</button>
            <button>Eletroeletrônica II</button>
        </div>

        <div class="conteudo">
            <div class="medalhas">

                <div class="box">
                    <img src="imagens/medalha1.png" alt="">
                    <p><span>Média</span> >= 95</p>
                    <p><span>Frequência</span> = 100%</p>
                    <p>Todos os <span>Cursos EADs</span> disponíveis devem ser completados</p>
                </div>

                <div class="box">
                    <img src="imagens/medalha3.png" alt="">
                    <p><span>Média</span> >= 95</p>
                    <p><span>Frequência</span> >= 97%</p>
                    <p>Todos os <span>Cursos EADs</span> disponíveis devem ser completados</p>
                </div>

                <div class="box">
                    <img src="imagens/medalha2.png" alt="">
                    <p><span>Média</span> >= 95</p>
                    <p><span>Frequência</span> >= 95%</p>
                    <p>Todos os <span>Cursos EADs</span> disponíveis devem ser completados</p>
                </div>

            </div>

            <div class="btn-fixo">
                <button onclick="window.location.href='inicio.html'">CADASTRAR MAIS TURMAS</button>
            </div>
        </div>
    </main>

</body>

</html>
