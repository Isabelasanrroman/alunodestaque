<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno Destaque</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
        }

        .background{
            position: relative;
            width:100%;
            height:100vh;
            overflow: hidden;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .background video{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:-1;
        }

        .card{
            background: rgba(255, 255, 255, 0.797);
            backdrop-filter: blur(8px);
            border-radius:20px;
            padding:50px 40px;
            width:420px;
            text-align:center;
            box-shadow:0 25px 60px rgba(16, 16, 16, 0.29);
            animation: surgir 0.8s ease;
        }

        .logo img{
            width:230px;
            margin-bottom:25px;
        }

        .texto p{
            color:#333;
            font-size:16px;
            line-height:1.6;
        }

        .texto p strong{
            color:#c00000;
        }

        .botoes{
            margin-top:35px;
            display:flex;
            gap:18px;
            justify-content:center;
        }

        .botoes button{
            padding:12px 30px;
            font-size:16px;
            border-radius:8px;
            border: 1px solid rgb(217, 42, 42);
            cursor:pointer;
            font-weight:600;
            transition:0.3s;
        }

        .entrar{
            background:#e60000;
            color:white;
            box-shadow:0 6px 15px rgba(230,0,0,0.35);
        }

        .entrar:hover{
            background:#b80000;
            transform:translateY(-2px);
        }

        .cadastrar{
            background:white;
            color:#b80000;
            border:2px solid #b80000;
        }

        .cadastrar:hover{
            background:#b80000;
            color:white;
            transform:translateY(-2px);
        }

        footer{
            margin-top:25px;
            font-size:13px;
            color:#777;
        }
    </style>
</head>

<body>

    <div class="background">

        <video autoplay muted loop>
            <source src="imagens/video.mp4" type="video/mp4">
        </video>

        <div class="card">

            <div class="logo">
                <img src="https://www.precisaocortelaser.com.br/wp-content/uploads/2020/07/logo-senai-1.png">
            </div>

            <div class="texto">
                <p>Cadastre os alunos de cada turma,</p>
                <p>faça upload de suas planilhas e</p>
                <p>receba a <strong>classificação dos alunos destaques</strong>.</p>
            </div>

            <div class="botoes">
                <button class="entrar" onclick="window.location.href='entrar.html'">Entrar</button>
                <button class="cadastrar" onclick="window.location.href='cadastrar.html'">Cadastrar</button>
            </div>

            <footer>
                Sistema de Classificação Escolar - SENAI
            </footer>

        </div>

    </div>

</body>
</html>
