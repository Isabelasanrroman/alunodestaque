<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cursos</title>
    <link rel="stylesheet" href="../css/cadastrar.css">
</head>

<body>

    <div class="background">
        <div class="container">

            <div class="logo">
                <img src="https://www.precisaocortelaser.com.br/wp-content/uploads/2020/07/logo-senai-1.png">
            </div>

            <div class="card">
                <h2>CADASTRE-SE</h2>

                <div class="input">
                    <span>Nome</span>
                    <input type="text" id="nome">
                </div>

                <div class="input">
                    <span>Email</span>
                    <input type="email" id="email">
                </div>

                <div class="input">
                    <span>Senha</span>
                    <input type="password" id="senha">
                </div>

                <button onclick="cadastrar()">CADASTRAR</button>
            </div>

            <p class="login">
                Já possui uma conta? <a href="entrar.html">Entrar</a>
            </p>

        </div>
    </div>

<script src="../java_script/cadastrar.js"></script>

</body>
</html>
