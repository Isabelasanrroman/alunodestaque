<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Turmas</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        height: 100vh;
    }

    .background {
        width: 100%;
        height: 100vh;
        background: url(imagens/fundo.png) no-repeat center;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .logo {
        margin-bottom: 15px;
    }

    .logo img {
        width: 150px;
    }

    .card {
        width: 420px;
        background: white;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 0 120px rgba(0, 0, 0, 0.242);
        text-align: center;
    }

    .card h2 {
        color: #c00000;
        font-size: 18px;
        margin-bottom: 25px;
        letter-spacing: 1px;
    }

    .input {
        background: #e6e6e6;
        border-radius: 12px;
        padding: 12px 16px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
    }

    .input span {
        color: #777;
        font-size: 14px;
        margin-right: 10px;
        min-width: 55px;
    }

    .input input {
        border: none;
        background: transparent;
        outline: none;
        font-size: 15px;
        width: 100%;
    }

    .upload {
        background: #e6e6e6;
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 18px;
        text-align: left;
        font-size: 14px;
        color: #777;
        cursor: pointer;
    }

    .upload input {
        margin-top: 6px;
    }

    .card button {
        width: 140px;
        height: 42px;
        background: #d10000;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        margin-top: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .card button:hover {
        background: #bd0000;
        box-shadow: 0 0 20px #0000004c;
        transform: translateY(-2px);
    }

    .login {
        margin-top: 18px;
        font-size: 14px;
    }

    .login a {
        color: #cd1919;
        font-weight: bold;
        text-decoration: none;
    }
</style>

<body>

    <div class="background">
        <div class="container">

            <div class="logo">
                <img src="https://www.precisaocortelaser.com.br/wp-content/uploads/2020/07/logo-senai-1.png">
            </div>

            <div class="card">
                <h2>CADASTRAR TURMA</h2>

                <div class="input">
                    <span>Turma</span>
                    <input type="text" id="turma">
                </div>

                <div class="upload">
                    Envie sua planilha:
                    <input type="file" id="arquivo" accept=".xlsx,.xls,.csv,.pdf">
                </div>

                <button onclick="enviarArquivo()">CADASTRAR</button>
            </div>

            <p class="login">
                Já possui um cadastro? <a href="#">Entrar</a>
            </p>

        </div>
    </div>

</body>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
function enviarArquivo() {
    const file = document.getElementById('arquivo').files[0];

    if (!file) {
        alert("Escolha um arquivo!");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const dados = XLSX.utils.sheet_to_json(sheet);

        let alunos = dados.map(a => {
            const media = (
                Number(a.nota1) +
                Number(a.nota2) +
                Number(a.nota3) +
                Number(a.nota4)
            ) / 4;

            const freq = Number(a.frequencia);

            let medalha = '';
            if (media >= 95 && freq == 100) medalha = '🥇 Ouro';
            else if (media >= 95 && freq >= 97) medalha = '🥈 Prata';
            else if (media >= 95 && freq >= 95) medalha = '🥉 Bronze';

            return {
                nome: a.nome,
                media: media.toFixed(2),
                frequencia: freq,
                medalha
            };
        });

        alunos.sort((a,b) => b.media - a.media);

        localStorage.setItem("alunos", JSON.stringify(alunos));

        window.location.href = "arquivo.html";
    };

    reader.readAsArrayBuffer(file);
}
</script>

</html>
